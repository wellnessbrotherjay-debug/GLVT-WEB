<head>

  <!-- Google Fonts: Playfair Display and Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@200;300;400;500;600&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Tailwind Config -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            glvt: {
              sand: '#E8DCC9',      // Beige / Sand
              greige: '#CFC7BA',    // Structural greige
              charcoal: '#3A3A3C',  // Charcoal gray
              obsidian: '#0E0E10',  // Obsidian black
              champagne: '#D6BA7A', // Accent gold
              
              // Mapped for compatibility
              black: '#0E0E10',
              white: '#FFFFFF',
              stone: '#CFC7BA',
              cream: '#E8DCC9',
            }
          },
          fontFamily: {
            serif: ['"Playfair Display"', 'serif'],
            sans: ['"Montserrat"', 'sans-serif'],
          },
          letterSpacing: {
            'tight': '-0.02em',
            'wide': '0.05em',
            'widest': '0.15em',
            'super-wide': '0.25em',
          },
          backgroundImage: {
            'gradient-radial': 'radial-gradient(var(--tw-gradient-stops))',
          }
        }
      }
    }
  </script>
  <style>
    /* Hide scrollbar for clean look */
    ::-webkit-scrollbar {
      width: 4px;
    }

    ::-webkit-scrollbar-track {
      background: #0F0F0F;
    }

    ::-webkit-scrollbar-thumb {
      background: #2A2A2A;
    }

    html {
      scroll-behavior: smooth;
      cursor: default;
    }

    ::selection {
      background: #9C9288;
      color: #fff;
    }

    .text-outline {
      -webkit-text-stroke: 1px rgba(255, 255, 255, 0.3);
      color: transparent;
    }

    .text-outline-dark {
      -webkit-text-stroke: 1px rgba(15, 15, 15, 0.2);
      color: transparent;
    }
  </style>
